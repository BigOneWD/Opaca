[project]
name = "opaca"
version = "0.1.0"
description = "Opaca treasury core, reconciliation, and paper-only execution lifecycle."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
paper = ["alpaca-py==0.33.0", "pytz==2025.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live_paper: optional live PAPER read-only smoke (requires credentials)",
  "live_paper_preflight: optional live PAPER read-only preflight (requires credentials)",
  "live_paper_mutation: optional live PAPER mutating smoke (requires credentials + opt-in)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["opaca", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # import sorting
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplify
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["opaca", "tests"]
mypy_path = "."

[[tool.mypy.overrides]]
module = "alpaca.*"
ignore_missing_imports = true
